<h1>नेपालको परिचय</h1>
<p id="p1">नेपाल हिमालयको काखमा रहेको एउटा सुन्दर देश हो। यहाँ संसारको सबैभन्दा अग्लो हिमाल सगरमाथा पर्छ। काठमाडौं नेपालको राजधानी हो।</p>
<p id="p2">Nepal is a landlocked country in South Asia. Its capital is Kathmandu.</p>
<p id="p3">नेपालमा १२५ भन्दा बढी जातजातिहरू बस्छन्। यहाँका मानिसहरू मिलनसार र मेहनती छन्।</p>

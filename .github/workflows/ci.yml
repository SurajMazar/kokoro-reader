name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build (includes manifest validation)
        run: npm run build
      # sharp (Node-only, pulled in by transformers.js) has high advisories with
      # no fix; it is not bundled, which the build's validator checks. Fail on critical.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-reader-zip
          path: release/*.zip

  e2e:
    name: End-to-end (real Chromium, real Kokoro inference)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - name: E2E (downloads the pinned 92 MB model once)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

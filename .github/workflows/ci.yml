name: CI/CD

# Pull requests: check, build and package.
# Pushes to main: the same, then publish the built extension as the rolling
# "latest" pre-release, so every main commit has an installable ZIP.
# Tags vX.Y.Z: see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (a transformers.js dependency the extension never runs)
  # downloads CUDA binaries on Linux at install time; that download now 404s.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build:
    name: Typecheck, lint, test, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build (includes manifest validation)
        run: npm run build
      # sharp (Node-only, pulled in by transformers.js) has high advisories with
      # no fix; it is not bundled, which the build's validator checks. Fail on critical.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Package
        run: npm run package
      # GitHub wraps every artifact in its own ZIP, so the artifact is the built
      # folder: the download is then a valid extension package (manifest.json at
      # its root) for "Load unpacked" or the Web Store. It is the only artifact,
      # so there is no ZIP-inside-a-ZIP to download by mistake.
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-reader-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  e2e:
    name: End-to-end (real Chromium, real Kokoro inference)
    # Playwright 1.56 cannot install Chromium's system dependencies on Ubuntu 26.04 (today's ubuntu-latest).
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - name: E2E (downloads the pinned 92 MB model)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  publish-latest:
    name: Publish "latest" build from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: kokoro-reader-${{ github.sha }}
          path: dist
      - name: Package (checks manifest.json is at the ZIP root)
        run: node scripts/package.ts
      - name: Replace the rolling "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip)
          cp "$zip" release/kokoro-reader-latest.zip
          short=$(git rev-parse --short HEAD)
          notes="Automatic build of main at ${short} ($(date -u +%Y-%m-%dT%H:%MZ)).

          Chrome Web Store: upload kokoro-reader-<version>.zip below as it is (manifest.json is at its root).
          Local install: unzip, open chrome://extensions, enable Developer mode, click Load unpacked and choose the folder.

          This is a development build. Versioned releases are published from v* tags."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$zip" release/kokoro-reader-latest.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main @ ${short})" --notes "$notes"

# Builds the project site (site/) and publishes it to GitHub Pages:
# https://surajmazar.github.io/kokoro-reader/
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # See ci.yml: onnxruntime-node's CUDA download now returns 404.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # onnxruntime-node (a transformers.js dependency the extension never runs)
  # downloads CUDA binaries on Linux at install time; that download now 404s.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  STORE_URL: https://chromewebstore.google.com/detail/kokoro-reader/jjkkkegnnbehafabbhbolcdnfcjniamj

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf 'Install from the Chrome Web Store: %s\n\n' "$STORE_URL"; cat CHANGELOG.md; } > release/NOTES.md
          gh release create "$GITHUB_REF_NAME" release/*.zip --title "Kokoro Reader $GITHUB_REF_NAME" --notes-file release/NOTES.md
